<!-- ============================================ -->
<!--                 Navigation                   -->
<!-- ============================================ -->

<header id="cs-navigation">
    <div class="cs-top-bar">
        <div class="cs-top-container">
            <div class="cs-top-contact">
                <a href="tel:{{ client.phoneForTel }}" class="cs-top-link">
                    <img class="cs-link-icon" src="/assets/svgs/phone-grey.svg" alt="" width="16" height="16" aria-hidden="true" decoding="async">
                    Call us: {{ client.phoneFormatted }}
                </a>
                <a href="/contact/" class="cs-top-link">
                    <img class="cs-link-icon" src="/assets/svgs/clock-grey.svg" alt="" width="20" height="20" aria-hidden="true" decoding="async">
                    Open 24/7
                </a>
            </div>
        </div>
    </div>
    <div class="cs-container">
        <!--Nav Logo-->
        <a href="/" class="cs-logo" aria-label="Bug Guys Pest Control home">
            <img src="/assets/svgs/bug-rectangle-logo.svg" alt="" width="197" height="43" aria-hidden="true" decoding="async">
        </a>
        <!--Navigation List-->
        <nav class="cs-nav" role="navigation">
            <!--Mobile Nav Toggle-->
            <button class="cs-toggle" aria-label="mobile menu toggle">
                <div class="cs-box" aria-hidden="true">
                    <span class="cs-line cs-line1" aria-hidden="true"></span>
                    <span class="cs-line cs-line2" aria-hidden="true"></span>
                    <span class="cs-line cs-line3" aria-hidden="true"></span>
                </div>
            </button>
            <!-- We need a wrapper div so we can set a fixed height on the cs-ul in case the nav list gets too long from too many dropdowns being opened and needs to have an overflow scroll. This wrapper acts as the background so it can go the full height of the screen and not cut off any overflowing nav items while the cs-ul stops short of the bottom of the screen, which keeps all nav items in view no matter how mnay there are-->
            <div class="cs-ul-wrapper">
                <ul id="cs-expanded" class="cs-ul" aria-expanded="false">
                    <li class="cs-li">
                        <a href="/" class="cs-li-link{% if page.url == '/' %} cs-active{% endif %}"{% if page.url == '/' %} aria-current="page"{% endif %}>
                            Home
                        </a>
                    </li>
                    <!--Copy and paste this cs-dropdown list item and replace any .cs-li with this cs-dropdown group to make a new dropdown and it will work-->
                    <li class="cs-li cs-dropdown" tabindex="0">
                        <span class="cs-li-link">
                            Services
                            <img class="cs-drop-icon" src="/assets/svgs/chev-down.svg" alt="" width="15" height="15" decoding="async" aria-hidden="true">
                        </span>
                        <ul class="cs-drop-ul">
                            <li class="cs-drop-li">
                                <a href="/pest-control/" class="cs-li-link cs-drop-link">Pest Control</a>
                            </li>
                            <li class="cs-drop-li">
                                <a href="/termite-protection/" class="cs-li-link cs-drop-link">Termite Protection</a>
                            </li>
                            <li class="cs-drop-li">
                                <a href="/crawlspace-encapsulation/" class="cs-li-link cs-drop-link">Crawlspace Encapsulation</a>
                            </li>
                        </ul>
                    </li>
                    <li class="cs-li">
                        <a href="/about/" class="cs-li-link{% if page.url == '/about/' %} cs-active{% endif %}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>
                            About
                        </a>
                    </li>
                    <li class="cs-li">
                        <a href="/reviews/" class="cs-li-link{% if page.url == '/reviews/' %} cs-active{% endif %}"{% if page.url == '/reviews/' %} aria-current="page"{% endif %}>
                            Reviews
                        </a>
                    </li>
                    <li class="cs-li">
                        <a href="/contact/" class="cs-li-link{% if page.url == '/contact/' %} cs-active{% endif %}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>
                            Contact
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        <a href="/contact/" class="cs-button-solid cs-nav-button">Contact Us</a>
    </div>
</header>
